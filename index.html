<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Thư Mời Tân Gia</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Be+Vietnam+Pro:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="card">
      <div class="card-overlay">
        <h3>🏡 THƯ MỜI TÂN GIA</h3>

        <h1>LỄ TÂN GIA</h1>

        <p class="invite">Trân trọng kính mời Anh/Chị</p>

        <h2><span id="guestName">Quý khách</span></h2>

        <p class="desc">
          Đến chung vui cùng gia đình chúng tôi trong buổi lễ tân gia
        </p>

        <div class="info">
          <p>📅 18:00 - Thứ 7, ngày 25/07/2026</p>

          <p>
            📍 Hẻm số 2, tổ 4, khu phố Tân Mỹ, Tân Đông Hiệp
          </p>
        </div>

        <a
          class="mapBtn"
          href="https://maps.app.goo.gl/JNnJixPeTQXcMSFV6"
          target="_blank"
        >
          Xem Google Maps
        </a>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
